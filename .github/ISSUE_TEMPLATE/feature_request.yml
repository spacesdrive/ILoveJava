name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who benefits, and why does it matter for a Java learner?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: architecture
    attributes:
      label: Architecture check
      options:
        - label: This can be implemented entirely client-side (see docs/architecture) - or I've explained below why it can't
          required: false
