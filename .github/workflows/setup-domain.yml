name: Setup Custom Domain

on:
  workflow_dispatch:

jobs:
  add-domain:
    name: Attach ilovejava.spacesdrive.cc to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Add custom domain via Cloudflare API
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/ilovejava/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"ilovejava.spacesdrive.cc"}' \
            -o response.json -w "HTTP %{http_code}\n"
          cat response.json
          echo
          success=$(node -e "console.log(require('./response.json').success)")
          if [ "$success" != "true" ]; then
            echo "::error::Cloudflare API reported failure - see response body above"
            exit 1
          fi

      - name: Check domain status
        run: |
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/ilovejava/domains/ilovejava.spacesdrive.cc" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -o status.json -w "HTTP %{http_code}\n"
          cat status.json
